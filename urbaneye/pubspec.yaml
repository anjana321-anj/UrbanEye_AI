name: urbaneye
description: "UrbanEye — See It. Report It. Fix It. Smart-city civic reporting and municipal management platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Typography (Plus Jakarta Sans). Falls back to system font when offline.
  google_fonts: ^6.2.1

  # Device capabilities
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  connectivity_plus: ^6.0.5

  # Maps (OpenStreetMap / CARTO tiles — no API key required)
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # Storage & formatting
  shared_preferences: ^2.3.2
  intl: any

